name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync Astro content types
        run: npx astro sync

      - name: Build
        env:
          # Required for sitemap absolute URLs
          SITE_URL: ${{ vars.SITE_URL || 'https://uzi.network.store' }}
        run: npm run build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: uzi-network
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # The action auto-creates the project on first deploy if it doesn't exist.
          # On first run, you'll see the project appear in Cloudflare dashboard.

      - name: Deployment summary
        if: success()
        run: |
          echo "### ✅ Deployed to Cloudflare Pages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Project: **uzi-network**" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`$GITHUB_REF_NAME\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`$GITHUB_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Once the Cloudflare Pages project is created (auto on first run), attach \`uzi.network.store\` in the Cloudflare dashboard under **Workers & Pages → uzi-network → Custom domains**." >> $GITHUB_STEP_SUMMARY

      - name: Deployment failed
        if: failure()
        run: |
          echo "### ❌ Deploy failed" >> $GITHUB_STEP_SUMMARY
          echo "Check the build logs above. Common causes: missing secrets, npm install failure, Cloudflare auth issue." >> $GITHUB_STEP_SUMMARY